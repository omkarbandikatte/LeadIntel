[tool.black]
line-length = 110
target-version = ["py312"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: line length is black's job. B008: Depends(...) in a default arg is the
# required FastAPI DI pattern, not the general anti-pattern this rule targets.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
